
      - name: Extract project
        run: |
          ZIP_FILE=$(find . -type f -iname '*.zip' -not -path './.git/*' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP archive not found"
            find . -maxdepth 3 -type f
            exit 1
          fi
          echo "Found archive: $ZIP_FILE"
          unzip "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Project files not found"
            exit 1
          fi
          cp -R "$PROJECT_DIR"/. .
