name: Build CargoFix APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - uses: actions/checkout@v4

      - name: Extract game
        run: |
          unzip -o CargoFix3D_v06.zip -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name project.godot -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          cp export_presets.cfg "$PROJECT_DIR/export_presets.cfg"

      - name: Prepare Android
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable

          SETTINGS=~/.config/godot/editor_settings-4.3.tres
          echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> "$SETTINGS"
          echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> "$SETTINGS"
          echo 'export/android/debug_keystore = "/root/debug.keystore"' >> "$SETTINGS"
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> "$SETTINGS"
          echo 'export/android/debug_keystore_pass = "android"' >> "$SETTINGS"
          echo 'export/android/force_system_user = false' >> "$SETTINGS"

      - name: Import project
        run: |
          cd "$PROJECT_DIR"
          godot --headless --editor --path . --quit

      - name: Export APK
        run: |
          mkdir -p build
          cd "$PROJECT_DIR"
          godot --headless --path . --export-debug "Android" "$GITHUB_WORKSPACE/build/CargoFix.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CargoFix-APK
          path: build/CargoFix.apk
