name: Build CargoFix APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: firebelley/godot-export@v6
        with:
          godot_version: 4.3
          export_type: Android
          project_path: .
          export_path: build/CargoFix.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CargoFix-APK
          path: build/CargoFix.apk
          
