name: Build CargoFix APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - uses: actions/checkout@v4

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --editor --path . --quit
          godot --headless --path . --export-debug "Android" build/CargoFix.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CargoFix-APK
          path: build/CargoFix.apk
         
