name: Build CargoFix APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - uses: actions/checkout@v4

      - name: Extract game
        run: |
          mkdir -p game
          unzip -o CargoFix3D_v06.zip -d game
          cp export_presets.cfg game/export_presets.cfg

      - name: Prepare Godot Android
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable

      - name: Import project
        run: |
          godot --headless --editor --path game --quit

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path game --export-debug "Android" build/CargoFix.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CargoFix-APK
          path: build/CargoFix.apk
