
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MASTER_CRM_ANDROID_PROJECT.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip MASTER_CRM_ANDROID_PROJECT.zip -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Project files not found"
            exit 1
          fi
          cp -R "$PROJECT_DIR"/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Master-CRM-APK
          path: app/build/outputs/apk/debug/*.apk
